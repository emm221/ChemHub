<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in | ChemHub</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="auth.css"></head><body>
<header><a class="logo" href="index.html"><svg width="30" height="30" viewBox="0 0 26 26"><g stroke="#16834A" stroke-width="2.5" fill="none"><path d="M13 4v8l-7 5M13 12l7 5"/></g><circle cx="13" cy="4" r="3.5" fill="#105C38"/><circle cx="5" cy="19" r="3.5" fill="#32B768"/><circle cx="21" cy="19" r="3.5" fill="#16834A"/></svg>ChemHub</a><a href="index.html">&larr; Back to home</a></header>
<main><div class="card"><div id="cfg" class="note" style="display:none">Supabase is not connected yet. Fill in SUPABASE_URL and SUPABASE_ANON_KEY at the top of this file's script.</div>
<h1 id="ttl"></h1><p class="meta" id="sub"></p><div class="tabs" id="tabs"><a class="tab" href="#login">Sign in</a><a class="tab" href="#register">Create account</a></div><div id="form"></div><div class="msg" id="msg"></div></div></main>
<footer><b>ChemHub</b> &middot; Created by Emmanuel Musa &middot; Not an official FULAFIA platform</footer>
<script>
const {SUPABASE_URL="YOUR_SUPABASE_URL",SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY"}=window.CHEMHUB_CONFIG||{}; // anon key only, never service_role
const ok=!SUPABASE_URL.startsWith("YOUR_"),sb=ok?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null,$=s=>document.querySelector(s);
const HOME=new URL('index.html',location.href).href;if(!ok)$('#cfg').style.display='block';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function say(t,k){const m=$('#msg');m.className='msg '+(k||'err');m.textContent=t}
function err(e){const m=e.message||'';return/rate|too many/i.test(m)?'Too many attempts. Please wait a few minutes and try again.':/Invalid login/i.test(m)?'Email or password is incorrect.':/not confirmed/i.test(m)?'Please verify your email first. Check your inbox.':/registered|already/i.test(m)?'An account with this email already exists.':m}
const pw=(n,l,extra='')=>`<label>${l}</label><div class="pw"><input type="password" name="${n}" required ${extra}><button type="button" onclick="const i=this.previousElementSibling;i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'Show':'Hide'">Show</button></div>`;
const VIEWS={
login:['Welcome back','Sign in to your ChemHub account.',`<form id="f"><label>Email</label><input type="email" name="e" required autocomplete="email">${pw('p','Password','autocomplete="current-password"')}<button class="btn">Sign in</button><p class="meta" style="text-align:center"><a href="#forgot">Forgot your password?</a></p></form>`],
register:['Join ChemHub','Create your free student account.',`<form id="f"><label>Full name</label><input name="n" required minlength="3" autocomplete="name"><label>Email</label><input type="email" name="e" required autocomplete="email"><label>Matriculation number (optional, kept private)</label><input name="m"><div class="row"><div><label>Level</label><select name="l">${[100,200,300,400,500].map(l=>`<option value="${l}">${l} Level</option>`).join('')}</select></div><div><label>Department</label><input value="Chemistry" disabled></div></div>${pw('p','Password (at least 8 characters)','minlength="8" autocomplete="new-password"')}${pw('p2','Confirm password','autocomplete="new-password"')}<label style="display:flex;gap:8px;align-items:flex-start;font-weight:600"><input type="checkbox" required style="width:auto;min-height:20px;margin-top:5px">I agree to the <a href="terms.html">Terms of Use</a> and <a href="privacy.html">Privacy Policy</a></label><button class="btn">Create account</button></form>`],
forgot:['Reset password','Enter your email and we will send a reset link.',`<form id="f"><label>Email</label><input type="email" name="e" required><button class="btn">Send reset link</button><p class="meta" style="text-align:center"><a href="#login">Back to sign in</a></p></form>`],
reset:['Set a new password','Choose a new password for your account.',`<form id="f">${pw('p','New password','minlength="8" autocomplete="new-password"')}<button class="btn">Update password</button></form>`]};
function render(){const v=(location.hash.slice(1)||'login'),V=VIEWS[v]||VIEWS.login,k=VIEWS[v]?v:'login';$('#ttl').textContent=V[0];$('#sub').textContent=V[1];$('#form').innerHTML=V[2];$('#msg').className='msg';
$('#tabs').style.display=(k==='login'||k==='register')?'flex':'none';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.getAttribute('href')==='#'+k));
$('#f').onsubmit=async e=>{e.preventDefault();if(!ok)return say('Supabase is not connected yet. See the note at the top.');const f=new FormData(e.target),b=e.target.querySelector('.btn'),lab=b.textContent;b.disabled=true;b.textContent='Please wait...';
try{if(k==='login'){const{error}=await sb.auth.signInWithPassword({email:f.get('e'),password:f.get('p')});if(error)throw error;location.href=HOME}
else if(k==='register'){if(f.get('p')!==f.get('p2'))throw{message:'Passwords do not match.'};
const{data,error}=await sb.auth.signUp({email:f.get('e'),password:f.get('p'),options:{emailRedirectTo:HOME,data:{full_name:f.get('n'),matric_no:f.get('m'),level:f.get('l')}}});if(error)throw error;
if(data.user&&data.user.identities?.length===0)throw{message:'An account with this email already exists.'};
if(data.session)location.href=HOME;else{$('#form').innerHTML='';$('#ttl').textContent='Check your email';$('#sub').textContent='';say('The sign-up was accepted. Open the verification link sent to '+f.get('e')+', then come back and sign in.','ok')}}
else if(k==='forgot'){const{error}=await sb.auth.resetPasswordForEmail(f.get('e'),{redirectTo:location.href.split('#')[0]+'#reset'});if(error)throw error;say('Request accepted. If that email has an account, a reset link is on its way.','ok')}
else{const{error}=await sb.auth.updateUser({password:f.get('p')});if(error)throw error;say('Password updated. Taking you home...','ok');setTimeout(()=>location.href=HOME,1200)}}
catch(x){say(err(x))}b.disabled=false;b.textContent=lab}}
addEventListener('hashchange',render);render();
if(sb){sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')location.hash='#reset'});sb.auth.getSession().then(({data})=>{if(data.session&&['login','register',''].includes(location.hash.slice(1)))location.href=HOME})}
</script></body></html>
